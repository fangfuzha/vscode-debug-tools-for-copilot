name: Publish Extension

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Package Extension
        run: npm run package

      - name: Publish to VS Code Marketplace
        run: npx --no-install vsce publish --packagePath vscode-debug-tools-for-copilot-*.vsix --oidc
